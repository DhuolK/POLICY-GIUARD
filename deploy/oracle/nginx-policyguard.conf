# Install to /etc/nginx/sites-available/policyguard, symlink into sites-enabled/
# (setup.sh does this). Certbot adds the TLS (443) server block later — after
# running certbot, don't hand-edit this file except through certbot.
server {
    listen 80;
    server_name westlakeinsuranceltd.com www.westlakeinsuranceltd.com;

    # Match the app's MAX_CONTENT_LENGTH (16 MB) for claim-evidence uploads.
    client_max_body_size 16m;

    # Serve static assets directly; cheaper than passing them through Flask.
    location /static/ {
        alias /srv/policyguard/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        # The app runs Werkzeug ProxyFix (x_for=1, x_proto=1, x_host=1), so these
        # headers are what make login rate-limiting see real client IPs and
        # Flask generate correct https:// URLs.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
